name: Website

# Push to main only -- PRs happen on forge now (see CLAUDE.md), which has
# no Pages equivalent, so this stays GitHub-only but no longer needs a
# pull_request trigger.
on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'Makefile'
      - '.github/workflows/website.yml'

permissions:
  contents: read

# A superseded deploy is never worth finishing, but let an in-flight one to
# main finish rather than leaving Pages serving a half-published site.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Lint and prerender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No toolchain is installed here on purpose: website/rust-toolchain.toml
      # pins it, and rustup honours that on the first cargo call. Installing
      # "stable" here instead would let CI drift ahead of developers' machines,
      # which is what broke this workflow's first run—rustfmt 1.97 disagreed
      # with a local 1.95.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: website

      - run: make website-lint

      - run: make website-build

      # Content pages must work and look right with scripting off, so they ship
      # no executable script (WEB-001). Leptos emits inline hydration
      # bookkeeping that the prerenderer strips; if a change ever reintroduces a
      # script, fail here rather than quietly serving it. Two things pass:
      # JSON-LD blocks, which browsers never execute, and dmn-viewer.html—a
      # deliberate, isolated interactive page that loads dmn-js to render a
      # model in standard DMN tooling.
      - name: Assert the content pages ship no executable scripts or wasm
        run: |
          offenders=$(grep -roE '<script[^>]*>|\.wasm' website/dist \
            | grep -v '^website/dist/dmn-viewer\.html:' \
            | grep -vx '[^:]*:<script type="application/ld+json">' || true)
          if [ -n "$offenders" ]; then
            echo "::error::prerendered output contains executable scripts or wasm; see WEB-001"
            echo "$offenders"
            exit 1
          fi
          echo "content pages ship no executable scripts (JSON-LD and dmn-viewer.html excepted)"

      - name: Assert the deployable artifact is complete
        run: |
          for f in index.html 404.html CNAME robots.txt sitemap.xml favicon.svg; do
            test -s "website/dist/$f" || { echo "::error::missing or empty website/dist/$f"; exit 1; }
          done
          # The stylesheet's filename is content-hashed (style.<hash>.css), so
          # its name isn't fixed like the files above.
          stylesheet=$(find website/dist -maxdepth 1 -name 'style.*.css' -size +0c)
          [ -n "$stylesheet" ] || { echo "::error::missing or empty content-hashed stylesheet in website/dist"; exit 1; }
          # .nojekyll is meaningful precisely by existing; it is always empty.
          test -f website/dist/.nojekyll || { echo "::error::missing website/dist/.nojekyll"; exit 1; }
          grep -qx 'www.pgdmn.com' website/dist/CNAME || { echo "::error::CNAME is not www.pgdmn.com"; exit 1; }
          # The sitemap is built from the pages actually written, so an empty
          # one means the page walk broke, not that the site has no pages.
          grep -q '<loc>https://www.pgdmn.com/</loc>' website/dist/sitemap.xml || { echo "::error::sitemap.xml does not list the home page"; exit 1; }
          grep -q 'Sitemap: https://www.pgdmn.com/sitemap.xml' website/dist/robots.txt || { echo "::error::robots.txt does not name the sitemap"; exit 1; }
          echo "index, 404, CNAME, robots, sitemap, favicon, .nojekyll and stylesheet all present"

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v5
