name: Website

on:
  push:
    branches: [main]
    paths:
      - 'website/**'
      - 'Makefile'
      - '.github/workflows/website.yml'
  pull_request:
    paths:
      - 'website/**'
      - 'Makefile'
      - '.github/workflows/website.yml'

permissions:
  contents: read

# A superseded deploy is never worth finishing, but let an in-flight one to
# main finish rather than leaving Pages serving a half-published site.
concurrency:
  group: website-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  build:
    name: Lint and prerender
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # No toolchain is installed here on purpose: website/rust-toolchain.toml
      # pins it, and rustup honours that on the first cargo call. Installing
      # "stable" here instead would let CI drift ahead of developers' machines,
      # which is what broke this workflow's first run—rustfmt 1.97 disagreed
      # with a local 1.95.
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: website

      - run: make website-lint

      # Markdown parsing, front matter, and the metadata limits the pages are
      # written against: cheap, and they fail before a build that would look
      # fine and read wrong.
      - run: make website-test

      - run: make website-build

      # The content pages ship no JavaScript (WEB-001). Leptos emits inline
      # hydration bookkeeping that the prerenderer strips; if a change ever
      # reintroduces a script, fail here rather than quietly serving it. The one
      # allowed exception is dmn-viewer.html—a deliberate, isolated interactive
      # page that loads dmn-js to render a model in standard DMN tooling.
      - name: Assert the content pages ship no scripts or wasm
        run: |
          offenders=$(grep -rlE '<script|\.wasm' website/dist/ | grep -v '/dmn-viewer\.html$' || true)
          if [ -n "$offenders" ]; then
            echo "::error::prerendered output contains scripts or wasm; see WEB-001"
            echo "$offenders"
            exit 1
          fi
          echo "content pages are script-free (dmn-viewer.html excepted)"

      # A missing tag costs nothing at build time and everything at the moment
      # someone pastes a link, where it is invisible until a human notices a
      # bare URL. dist/ is on disk, so check it here instead (WEB-007).
      # dmn-viewer.html is exempt: it renders whatever `?model=` names, so it
      # is deliberately noindex with no card of its own.
      - name: Assert every page carries its social metadata
        run: |
          status=0
          while IFS= read -r page; do
            case "$page" in */dmn-viewer.html) continue ;; esac
            for tag in 'name="description"' 'property="og:title"' \
                       'property="og:description"' 'property="og:image"' \
                       'name="twitter:card"' 'rel="canonical"'; do
              grep -qF "$tag" "$page" || { echo "::error file=$page::missing $tag"; status=1; }
            done
            # Relative URLs are silently dropped by crawlers, so the card and
            # canonical have to be absolute.
            grep -qF 'content="https://www.pgdmn.com/share-card.png"' "$page" \
              || { echo "::error file=$page::og:image is not the absolute card URL"; status=1; }
          done < <(find website/dist -name '*.html')
          for asset in share-card.png favicon.svg favicon.ico apple-touch-icon.png; do
            test -s "website/dist/$asset" || { echo "::error::missing website/dist/$asset"; status=1; }
          done
          [ "$status" -eq 0 ] || exit 1
          echo "every page carries its social metadata, and the card and icons are present"

      - name: Assert the deployable artifact is complete
        run: |
          for f in index.html 404.html CNAME; do
            test -s "website/dist/$f" || { echo "::error::missing or empty website/dist/$f"; exit 1; }
          done
          # The stylesheet's filename is content-hashed (style.<hash>.css), so
          # its name isn't fixed like the files above.
          stylesheet=$(find website/dist -maxdepth 1 -name 'style.*.css' -size +0c)
          [ -n "$stylesheet" ] || { echo "::error::missing or empty content-hashed stylesheet in website/dist"; exit 1; }
          # .nojekyll is meaningful precisely by existing; it is always empty.
          test -f website/dist/.nojekyll || { echo "::error::missing website/dist/.nojekyll"; exit 1; }
          grep -qx 'www.pgdmn.com' website/dist/CNAME || { echo "::error::CNAME is not www.pgdmn.com"; exit 1; }
          echo "index, 404, CNAME, .nojekyll and stylesheet all present"

      - uses: actions/upload-pages-artifact@v5
        if: github.ref == 'refs/heads/main'
        with:
          path: website/dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@v6
        with:
          enablement: true

      - id: deployment
        uses: actions/deploy-pages@v5
