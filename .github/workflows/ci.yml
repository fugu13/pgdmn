name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# Cancel a superseded PR run (the new push makes the old one moot), but let a
# run on main finish rather than leaving results incomplete for a merged commit.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  extension:
    name: Extension (lint + pgrx tests)
    runs-on: ubuntu-latest
    env:
      DOCKER_BUILD_CACHE: "--cache-from type=gha,scope=pgdmn-test --cache-to type=gha,mode=max,scope=pgdmn-test"
    steps:
      - uses: actions/checkout@v7

      # ubuntu-latest ships several GB of toolchains this project never uses
      # (.NET, Android SDK, GHC). The Docker image (PG17 + pgrx toolchain)
      # plus a full opt-level-3 dev-profile workspace build (see Performance
      # in CLAUDE.md) can exceed the runner's free disk without this —
      # observed as "No space left on device" mid-compile.
      - name: Free disk space
        run: |
          df -h /
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/local/share/boost
          df -h /

      # Creates a docker-container builder so `--cache-to type=gha` and
      # `--load` work; sets it as the default buildx builder that
      # `make test-image`'s `docker buildx build` will use.
      - uses: docker/setup-buildx-action@v4

      # Exposes ACTIONS_RUNTIME_TOKEN / ACTIONS_CACHE_URL into the environment
      # so a raw `docker buildx build --cache-to type=gha` (invoked by the
      # Makefile, not by build-push-action) can read/write the GitHub Actions
      # cache.
      - uses: crazy-max/ghaction-github-runtime@v4

      # The container writes compiled artifacts to the bind-mounted `target/`;
      # caching it keeps pgrx/dsntk from recompiling every run. The run_id in
      # the key makes every run save a fresh entry (an exact-key hit would skip
      # the save and discard this run's incremental progress); restore-keys
      # falls back to the newest prior entry for the same Cargo.lock. The `-v2-`
      # prefix retires caches saved before target/test-pgdata was excluded (see
      # the prune steps below) -- those carry a 0755 PG data dir that Postgres
      # refuses to start on.
      - uses: actions/cache@v6
        with:
          path: target
          key: ${{ runner.os }}-cargo-target-v2-${{ hashFiles('Cargo.lock') }}-${{ github.run_id }}
          restore-keys: |
            ${{ runner.os }}-cargo-target-v2-${{ hashFiles('Cargo.lock') }}-
            ${{ runner.os }}-cargo-target-v2-

      # Two prep steps folded together: (1) drop any pgrx test cluster a restored
      # cache might carry so Postgres always starts from a fresh mode-0700 data
      # dir, and (2) hand the bind-mounted workspace to uid 1000 -- the image's
      # `pgdmn` user, since pgrx/initdb refuse to run as root.
      - name: Prepare the workspace for the container
        run: |
          sudo rm -rf target/test-pgdata
          sudo chown -R 1000:1000 .

      # One `make` invocation so the shared `test-image` prerequisite -- and the
      # multi-GB `docker buildx --load` it performs -- runs once; separate
      # `make lint` and `make test` calls would each rebuild and reload the
      # image first. The build reuses the GitHub Actions layer cache set via
      # DOCKER_BUILD_CACHE above.
      - name: Build the test image, then lint and test
        run: make lint test

      # pgrx's throwaway Postgres cluster (target/test-pgdata) must never be
      # cached: Postgres refuses to start unless the data dir is mode 0700, but
      # the `a+rX` below -- needed so the runner can tar the uid-1000-owned tree
      # -- would leave it 0755 and poison the next run. Delete it first, then
      # make the remaining compiled artifacts readable for cache archival.
      - name: Prune the PG test cluster and make target cache-readable
        if: always()
        run: |
          sudo rm -rf target/test-pgdata
          sudo chmod -R a+rX target || true

      - name: Upload proptest regressions on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: proptest-regressions
          path: |
            proptest-regressions/**
            src/**/proptest-regressions/**
          if-no-files-found: ignore
          retention-days: 7

  # Security-advisory scan of the dependency tree; kept OFF the required
  # aggregate so an unfixable upstream advisory in the pgrx/dsntk tree never
  # blocks unrelated PRs.
  audit:
    name: cargo-audit (advisories, non-blocking)
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2.85.5
        with:
          tool: cargo-audit

      - run: cargo audit

  # Dependency license policy (cargo-deny, allowlist in deny.toml). Unlike the
  # audit job above, this is a policy gate on *future* PRs, not a scan for
  # externally-discovered vulnerabilities in code already merged -- there is
  # no "unfixable upstream advisory" analog here, a rejected license is
  # exactly the outcome the gate exists to produce, so it stays on the
  # required aggregate. Pure manifest/lockfile analysis (`cargo metadata`
  # under the hood) -- no Docker/pgrx/PG needed, so it runs directly on the
  # runner. Three separate `cargo deny` invocations because the repo is three
  # separate cargo workspaces (root pgdmn + vendored dsntk crates, website/,
  # profiling/ -- see the root Cargo.toml's `exclude`), each with its own
  # Cargo.lock; `make license-check` points all three at the one shared
  # deny.toml.
  license:
    name: cargo-deny (license policy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: taiki-e/install-action@v2.85.5
        with:
          # Pinned: cargo-deny's CLI has moved --config between the top-level
          # and the `check` subcommand across versions (an unpinned install
          # once resolved a version where `check --config` was rejected,
          # while every version tested locally accepts it there) -- pin to
          # what's actually verified rather than drift silently.
          tool: cargo-deny@0.19.4

      - run: make license-check

  # Enforces CI-004: README.md and the website Docs page must each cover every
  # #[pg_extern] function in src/functions/*.rs. Pure text analysis over the
  # checked-out source (scripts/doc_check.sh) -- no Docker/pgrx/PG needed, so
  # this runs directly on the runner rather than through the extension job's
  # container. Deliberately unconditional (no `paths:` filter -- see CI-003)
  # so it always reports and never leaves the required aggregate pending.
  docs:
    name: Documentation coverage (README + website Docs page)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - run: make doc-check

  ci:
    name: CI aggregate
    if: always()
    # audit is deliberately excluded here because it is non-blocking.
    needs: [extension, docs, license]
    runs-on: ubuntu-latest
    steps:
      # A single required status check that goes green only if every needed job
      # succeeded. `skipped` is intentionally allowed so a future path-filtered
      # `extension` (see CI-003) never blocks a docs-only PR.
      - name: Fail if a required job failed or was cancelled
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
