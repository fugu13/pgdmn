[package]
name = "pgdmn"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
description = "DMN (Decision Model and Notation) support for PostgreSQL: evaluate decision tables and FEEL expressions in SQL."
repository = "https://github.com/fugu13/pgdmn"
homepage = "https://www.pgdmn.com"
readme = "README.md"
keywords = ["dmn", "feel", "decision", "postgres", "pgrx"]
categories = ["database"]

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_pgdmn"
path = "src/bin/pgrx_embed.rs"

[features]
default = ["pg17"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

# Keep the shared baseline in sync with website/Cargo.toml [lints.clippy]
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Justified allows:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"       # pgrx prelude imports
doc_markdown = "allow"
implicit_hasher = "allow"
needless_pass_by_value = "allow" # #[pg_extern] functions receive owned datums; signatures are the SQL interface
option_if_let_else = "allow"     # nursery; if-let/else fallback chains read clearer than map_or_else

[dependencies]
pgrx = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
dsntk-model = "0.2"
dsntk-feel = "0.2"
dsntk-feel-parser = "0.2"
dsntk-feel-evaluator = "0.2"
dsntk-model-evaluator = "0.2"
dsntk-feel-temporal = "0.2"
rapidhash = "1"

[dev-dependencies]
pgrx-tests = "0.16"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
