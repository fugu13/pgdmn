# Vendored dsntk crates are explicit workspace members so their own test
# suites can run in-tree (`cargo test -p dsntk-feel` etc.) — the safety net
# for in-tree engine optimizations. Cargo commands in the root still default
# to the pgdmn package; profiling/ is a separate host-native workspace.
[workspace]
members = [
    "vendor/dsntk-common",
    "vendor/dsntk-examples",
    "vendor/dsntk-feel",
    "vendor/dsntk-feel-evaluator",
    "vendor/dsntk-feel-grammar",
    "vendor/dsntk-feel-number",
    "vendor/dsntk-feel-parser",
    "vendor/dsntk-feel-regex",
    "vendor/dsntk-feel-temporal",
    "vendor/dsntk-macros",
    "vendor/dsntk-model",
    "vendor/dsntk-model-evaluator",
    "vendor/dsntk-recognizer",
]
exclude = ["profiling"]

[package]
name = "pgdmn"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_pgdmn"
path = "src/bin/pgrx_embed.rs"

[features]
default = ["pg17"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

# Keep the shared baseline in sync with website/Cargo.toml [lints.clippy]
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Justified allows:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"       # pgrx prelude imports
doc_markdown = "allow"
implicit_hasher = "allow"
needless_pass_by_value = "allow" # #[pg_extern] functions receive owned datums; signatures are the SQL interface
option_if_let_else = "allow"     # nursery; if-let/else fallback chains read clearer than map_or_else

[dependencies]
pgrx = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
dsntk-model = "0.3"
dsntk-feel = "0.3"
dsntk-feel-parser = "0.3"
dsntk-feel-evaluator = "0.3"
dsntk-model-evaluator = "0.3"
dsntk-feel-temporal = "0.3"
rapidhash = "1"

[dev-dependencies]
pgrx-tests = "0.16"
proptest = "1"

# dsntk is vendored (see vendor/README.md) so the DMN/FEEL engine can be
# profiled, optimized, and dependency-sliced in-tree. Sources are the published
# crates.io 0.3.0 tarballs, checksum-verified at vendoring time.
[patch.crates-io]
dsntk-common = { path = "vendor/dsntk-common" }
dsntk-examples = { path = "vendor/dsntk-examples" }
dsntk-feel = { path = "vendor/dsntk-feel" }
dsntk-feel-evaluator = { path = "vendor/dsntk-feel-evaluator" }
dsntk-feel-grammar = { path = "vendor/dsntk-feel-grammar" }
dsntk-feel-number = { path = "vendor/dsntk-feel-number" }
dsntk-feel-parser = { path = "vendor/dsntk-feel-parser" }
dsntk-feel-regex = { path = "vendor/dsntk-feel-regex" }
dsntk-feel-temporal = { path = "vendor/dsntk-feel-temporal" }
dsntk-macros = { path = "vendor/dsntk-macros" }
dsntk-model = { path = "vendor/dsntk-model" }
dsntk-model-evaluator = { path = "vendor/dsntk-model-evaluator" }
dsntk-recognizer = { path = "vendor/dsntk-recognizer" }

[profile.dev]
panic = "unwind"

# Benchmarks run through `cargo pgrx test` (dev profile). Every package on the
# measured per-row path — the pgdmn shim, the dsntk engine, serde_json, the
# Intel decimal FFI library — is built optimized so benchmark numbers reflect
# release-grade codegen; the rest of the graph stays at dev for build speed.
# (debug-assertions=false also disables overflow checks on these packages.)
[profile.dev.package.pgdmn]
opt-level = 3
debug-assertions = false
[profile.dev.package.dsntk-common]
opt-level = 3
debug-assertions = false
[profile.dev.package.dsntk-feel]
opt-level = 3
debug-assertions = false
[profile.dev.package.dsntk-feel-evaluator]
opt-level = 3
debug-assertions = false
[profile.dev.package.dsntk-feel-grammar]
opt-level = 3
debug-assertions = false
[profile.dev.package.dsntk-feel-number]
opt-level = 3
debug-assertions = false
[profile.dev.package.dsntk-feel-parser]
opt-level = 3
debug-assertions = false
[profile.dev.package.dsntk-feel-regex]
opt-level = 3
debug-assertions = false
[profile.dev.package.dsntk-feel-temporal]
opt-level = 3
debug-assertions = false
[profile.dev.package.dsntk-model]
opt-level = 3
debug-assertions = false
[profile.dev.package.dsntk-model-evaluator]
opt-level = 3
debug-assertions = false
[profile.dev.package.dfp-number-sys]
opt-level = 3
debug-assertions = false
[profile.dev.package.serde]
opt-level = 3
debug-assertions = false
[profile.dev.package.serde_json]
opt-level = 3
debug-assertions = false
[profile.dev.package.serde_cbor]
opt-level = 3
debug-assertions = false
[profile.dev.package.chrono]
opt-level = 3
debug-assertions = false
[profile.dev.package.chrono-tz]
opt-level = 3
debug-assertions = false
[profile.dev.package.regex]
opt-level = 3
debug-assertions = false
[profile.dev.package.regex-automata]
opt-level = 3
debug-assertions = false
[profile.dev.package.aho-corasick]
opt-level = 3
debug-assertions = false
[profile.dev.package.memchr]
opt-level = 3
debug-assertions = false
[profile.dev.package.rapidhash]
opt-level = 3
debug-assertions = false
[profile.dev.package.pgrx]
opt-level = 3
debug-assertions = false

[profile.release]
panic = "unwind"
opt-level = 3
lto = "thin"
