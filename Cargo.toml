[package]
name = "pgdmn"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib", "lib"]

[[bin]]
name = "pgrx_embed_pgdmn"
path = "src/bin/pgrx_embed.rs"

[features]
default = ["pg17"]
pg14 = ["pgrx/pg14", "pgrx-tests/pg14"]
pg15 = ["pgrx/pg15", "pgrx-tests/pg15"]
pg16 = ["pgrx/pg16", "pgrx-tests/pg16"]
pg17 = ["pgrx/pg17", "pgrx-tests/pg17"]
pg18 = ["pgrx/pg18", "pgrx-tests/pg18"]
pg_test = []

[dependencies]
pgrx = "0.16"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_cbor = "0.11"
dsntk-model = "0.2"
dsntk-feel = "0.2"
dsntk-feel-parser = "0.2"
dsntk-feel-evaluator = "0.2"
dsntk-model-evaluator = "0.2"
rapidhash = "1"

[dev-dependencies]
pgrx-tests = "0.16"

[profile.dev]
panic = "unwind"

[profile.release]
panic = "unwind"
opt-level = 3
lto = "fat"
