[package]
name = "pgdmn-website"
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

# Standalone workspace: the root pgdmn Cargo.toml excludes this directory
# (same reason as profiling/Cargo.toml). Without an explicit empty
# [workspace] table here, Cargo's ancestor search for a workspace root does
# not stop at the excluding manifest — it keeps walking up past it looking
# for one that includes this package, which surfaces as "current package
# believes it's in a workspace when it's not" whenever this checkout is
# nested inside another checkout of the same repo (e.g. an agent worktree
# under .claude/worktrees/, which sits under a Cargo.toml with the same
# exclude one level further up).
[workspace]

# Keep the shared baseline in sync with the root Cargo.toml [lints.clippy]
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Justified allows:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"       # leptos prelude imports
doc_markdown = "allow"
implicit_hasher = "allow"

# The site is prerendered to static HTML and has no client-side interactivity,
# so there is no wasm/hydration target: the crate is server-side only. Leptos
# renders the pages, `prerender` writes them to disk, and `serve` previews the
# result the way a static host would serve it.
[dependencies]
leptos = { version = "0.8", features = ["ssr"] }
leptos_router = { version = "0.8", features = ["ssr"] }
leptos_meta = { version = "0.8", features = ["ssr"] }
leptos_axum = "0.8"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.7", features = ["fs", "set-status"] }
grass = "0.13"
