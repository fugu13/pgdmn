[package]
name = "pgdmn-website"
version = "0.1.0"
edition = "2024"

# Keep the shared baseline in sync with the root Cargo.toml [lints.clippy]
[lints.clippy]
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
# Justified allows:
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
return_self_not_must_use = "allow"
wildcard_imports = "allow"       # leptos prelude imports
doc_markdown = "allow"
implicit_hasher = "allow"

# The site is prerendered to static HTML and has no client-side interactivity,
# so there is no wasm/hydration target: the crate is server-side only. Leptos
# renders the pages, `prerender` writes them to disk, and `serve` previews the
# result the way a static host would serve it.
[dependencies]
leptos = { version = "0.8", features = ["ssr"] }
leptos_router = { version = "0.8", features = ["ssr"] }
leptos_meta = { version = "0.8", features = ["ssr"] }
leptos_axum = "0.8"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
tower-http = { version = "0.7", features = ["fs", "set-status"] }
grass = "0.13"
